<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Editor</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>AI Image Editor</h1>
            <p>Powered by OpenCV & FastAPI</p>
        </header>
        
        <main>
            <div class="sidebar">
                <div class="control-group">
                    <h3>Upload Image</h3>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                
                <div class="control-group">
                    <h3>Filters</h3>
                    <button class="action-btn" data-action="grayscale">Grayscale</button>
                    <button class="action-btn" data-action="sepia">Sepia</button>
                    <div class="slider-control">
                        <label>Blur Intensity: <span id="blurVal">5</span></label>
                        <input type="range" id="blurSlider" min="1" max="21" step="2" value="5">
                        <button class="action-btn" data-action="blur" data-source="blurSlider">Apply Blur</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Adjustments</h3>
                    <div class="slider-control">
                        <label>Brightness: <span id="brightnessVal">0</span></label>
                        <input type="range" id="brightnessSlider" min="-100" max="100" value="0">
                        <label>Contrast: <span id="contrastVal">1.0</span></label>
                        <input type="range" id="contrastSlider" min="0.1" max="3.0" step="0.1" value="1.0">
                        <button class="action-btn" data-action="brightness_contrast" data-source="multi">Apply Adjustment</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Transform</h3>
                    <button class="action-btn" data-action="flip" data-value="1">Flip Horizontal</button>
                    <button class="action-btn" data-action="flip" data-value="0">Flip Vertical</button>
                    <button class="action-btn" data-action="rotate" data-value="90">Rotate 90°</button>
                </div>

                <div class="actions">
                    <button id="undoBtn" class="secondary-btn">Undo</button>
                    <button id="resetBtn" class="secondary-btn">Reset</button>
                    <button id="downloadBtn" class="primary-btn">Download</button>
                </div>
            </div>

            <div class="canvas-container">
                <div class="image-wrapper">
                    <p class="placeholder-text">Upload an image to start editing</p>
                    <img id="previewImage" style="display: none;">
                </div>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
